services:
  db:
    image: postgres:16
    container_name: eve-healthcare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eve_healthcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: eve-healthcare-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/eve_healthcare
      SECRET_KEY: docker-secret-key-change-this
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data: